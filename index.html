<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty Box Co</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  overflow:hidden;
}

/* BACKGROUND GLOW */
.landing{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top,#ff1493,#4b004b,#000000);
  color:white;
  text-align:center;
  position:relative;
}

/* ANIMATED GLOW ORBS */
.landing::before,
.landing::after{
  content:'';
  position:absolute;
  width:300px;
  height:300px;
  background:rgba(255,20,147,0.3);
  filter:blur(120px);
  border-radius:50%;
  animation: moveGlow 8s infinite alternate;
}

.landing::after{
  background:rgba(255,105,180,0.3);
  animation-delay:2s;
}

@keyframes moveGlow{
  from{transform:translate(-50px,-50px);}
  to{transform:translate(50px,50px);}
}

/* LOGO */
.logo{
  width:150px;
  height:150px;
  border-radius:50%;
  box-shadow:0 0 40px #ff1493,0 0 80px #ff69b4;
  margin-bottom:25px;
  animation: float 4s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
}

/* BRAND */
.brand{
  font-size:34px;
  font-weight:900;
  letter-spacing:3px;
  background:linear-gradient(90deg,#ff1493,#ff69b4,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:10px;
}

/* TAGLINE */
.desc{
  font-size:18px;
  max-width:320px;
  opacity:0.9;
  margin-bottom:40px;
}

/* BUTTON */
.scroll{
  padding:14px 28px;
  border-radius:30px;
  background:linear-gradient(90deg,#ff1493,#ff69b4);
  color:white;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 0 20px #ff1493;
  transition:0.3s;
}

.scroll:hover{
  transform:scale(1.1);
  box-shadow:0 0 40px #ff69b4;
}
</style>
</head>

<body>

<section class="landing">

  <img src="logo.png" class="logo">

  <div class="brand">BEAUTY BOX CO</div>

  <div class="desc">
    Glow different. Feel powerful. Own your beauty like a queen.
  </div>

  <!-- WORKING BUTTON -->
  <a href="product.html" class="scroll">Enter Shop 👑</a>

</section>

</body>
</html>
