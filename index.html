<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlowHer Beauty</title><style>
body {margin:0;font-family:Arial, sans-serif;scroll-behavior:smooth;}

/* LANDING PAGE */
.landing {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg, #000000, #4b004b, #ff1493);
  color:white;
  text-align:center;
}

.logo {
  width:140px;
  height:140px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 0 25px rgba(255,20,147,0.8);
  margin-bottom:20px;
}

.desc {
  max-width:300px;
  font-size:16px;
  line-height:1.5;
  font-weight:500;
}

.brand {
  font-size:22px;
  font-weight:bold;
  margin-bottom:10px;
  letter-spacing:2px;
}

.scroll {
  position:absolute;
  bottom:20px;
  font-size:14px;
  opacity:0.8;
  animation: bounce 1.5s infinite;
}

@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(8px); }
}

/* SHOP SECTION */
.shop {background:#fff0f5;padding:20px;}
.section h2 {color:#ff1493;text-align:center;}
.products {display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;}
.card {background:white;padding:10px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,0.1);text-align:center;}
.card img {width:100%;height:140px;object-fit:cover;border-radius:10px;}
.buy {margin-top:8px;padding:8px;border:none;border-radius:6px;background:#ff1493;color:white;cursor:pointer;}

footer {text-align:center;padding:15px;background:#ff1493;color:white;margin-top:20px;}
</style></head><body><!-- LANDING --><section class="landing">
  <div class="brand">👑 GLOWHER BEAUTY</div>
  <img src="logo.png" class="logo">
  <div class="desc">
    Luxury beauty for queens. Glow with confidence, elegance, and power in every product you use.
  </div>
  <div class="scroll">Scroll ↓</div>
</section><!-- SHOP --><section class="shop"><div class="section">
<h2>Beauty Collection 👑</h2>
<div class="products">
<div class="card"><img src="lipstick.jpg"><p>Luxury Lipstick</p><p>Ksh 500</p><button class="buy" onclick="order('Luxury Lipstick')">Buy Now</button></div>
<div class="card"><img src="foundation.jpg"><p>Queen Foundation</p><p>Ksh 1200</p><button class="buy" onclick="order('Queen Foundation')">Buy Now</button></div>
</div>
</div></section><footer>
<p>© 2026 GlowHer Beauty 👑</p>
</footer><script>
function order(product){let phone="254746496906";let message="Hello Queen 👑, I want to order: "+product;let url="https://wa.me/"+phone+"?text="+encodeURIComponent(message);window.open(url,'_blank');}
</script></body>
</html>
