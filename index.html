<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty Box Co - Products</title>
<style>
body {
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#fff0f5;
  color:#000;
}

/* PRODUCT GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
  gap:20px;
  padding:30px;
}

.product {
  cursor:pointer;
  text-align:center;
  transition: transform 0.3s;
}

.product img {
  width:100%;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(255,20,147,0.4);
}

.product:hover {
  transform:scale(1.05);
}

/* FULLSCREEN MODAL */
#viewer {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
  overflow:hidden;
}

#viewer img {
  max-width:90%;
  max-height:90%;
  transition:transform 0.3s;
  border-radius:15px;
}

/* ZOOM */
.zoomed {
  transform:scale(1.8);
}

/* ARROWS */
.arrow {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:48px;
  color:white;
  cursor:pointer;
  user-select:none;
  padding:10px;
}

.arrow-left {
  left:10px;
}

.arrow-right {
  right:10px;
}
</style>
</head>
<body>

<h2 style="text-align:center;color:#ff1493;margin-top:20px;">Beauty Box Co - Products</h2>

<!-- PRODUCT GRID -->
<div class="grid">
  <div class="product" onclick="openViewer('lipgloss')"><img src="lipgloss1.png" alt="Lipgloss"></div>
  <div class="product" onclick="openViewer('lipgloss')"><img src="lipgloss2.png" alt="Lipgloss"></div>
  <div class="product" onclick="openViewer('lipgloss')"><img src="lipgloss3.png" alt="Lipgloss"></div>
  <div class="product" onclick="openViewer('lipgloss')"><img src="lipgloss5.png" alt="Lipgloss"></div>

  <div class="product" onclick="openViewer('perfume')"><img src="perfume1.png" alt="Perfume"></div>
  <div class="product" onclick="openViewer('foundation')"><img src="foundation1.png" alt="Foundation"></div>
</div>

<!-- FULLSCREEN MODAL -->
<div id="viewer">
  <div class="arrow arrow-left" onclick="prevImage(event)">&#10094;</div>
  <img id="viewerImg" onclick="toggleZoom(event)">
  <div class="arrow arrow-right" onclick="nextImage(event)">&#10095;</div>
</div>

<script>
const products = {
  lipgloss: ["lipgloss1.png","lipgloss2.png","lipgloss3.png","lipgloss5.png"],
  perfume: ["perfume1.png"],
  foundation: ["foundation1.png"]
};

let currentProduct = [];
let currentIndex = 0;

function openViewer(product){
  currentProduct = products[product];
  currentIndex = 0;
  document.getElementById("viewer").style.display = "flex";
  document.getElementById("viewerImg").src = currentProduct[currentIndex];
}

function closeViewer(){
  document.getElementById("viewer").style.display = "none";
  document.getElementById("viewerImg").classList.remove("zoomed");
}

// Stop modal click from closing
document.getElementById("viewerImg").onclick = function(e){
  e.stopPropagation();
};

document.getElementById("viewer").onclick = function(){
  closeViewer();
};

function toggleZoom(e){
  e.stopPropagation();
  e.target.classList.toggle("zoomed");
}

function prevImage(e){
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + currentProduct.length) % currentProduct.length;
  document.getElementById("viewerImg").src = currentProduct[currentIndex];
  document.getElementById("viewerImg").classList.remove("zoomed");
}

function nextImage(e){
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % currentProduct.length;
  document.getElementById("viewerImg").src = currentProduct[currentIndex];
  document.getElementById("viewerImg").classList.remove("zoomed");
}
</script>

</body>
</html>
