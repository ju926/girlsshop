<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty Box Co - Products</title>
<style>
body {
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#fff0f5;
  color:#000;
}

h2 {
  text-align:center;
  color:#ff1493;
  margin-top:20px;
  font-size:2rem;
  font-weight:700;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
  gap:20px;
  padding:30px;
}

.product {
  cursor:pointer;
  text-align:center;
  transition: transform 0.3s, box-shadow 0.3s;
  border-radius:15px;
}

.product img {
  width:100%;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(255,20,147,0.4);
  transition: transform 0.3s, box-shadow 0.3s;
}

.product:hover img {
  transform:scale(1.05);
  box-shadow:0 8px 25px rgba(255,20,147,0.6);
}

/* MODAL */
#viewer {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  z-index:999;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

.carousel-container {
  display:flex;
  gap:20px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding:50px;
}

.carousel-item {
  min-width:80%;
  flex-shrink:0;
  scroll-snap-align:center;
  text-align:center;
  position:relative;
  border-radius:15px;
}

.carousel-item img {
  width:100%;
  border-radius:15px;
  transition: transform 0.3s;
}

.carousel-item:hover img {
  transform:scale(1.05);
  box-shadow:0 0 30px #ff69b4;
}

/* Info overlay */
.product-info {
  margin-top:10px;
  font-size:16px;
  color:white;
}

/* Close button */
#closeBtn {
  position:absolute;
  top:20px;
  right:20px;
  font-size:36px;
  color:white;
  cursor:pointer;
  user-select:none;
}
</style>
</head>
<body>

<h2>Beauty Box Co - Products</h2>

<div class="grid">
  <div class="product" onclick="openViewer('lipgloss')"><img src="lipgloss1.png" alt="Lipgloss"></div>
  <div class="product" onclick="openViewer('perfume')"><img src="perfume1.png" alt="Perfume"></div>
  <div class="product" onclick="openViewer('foundation')"><img src="foundation1.png" alt="Foundation"></div>
</div>

<div id="viewer">
  <div id="closeBtn" onclick="closeViewer()">&times;</div>
  <div class="carousel-container" id="carousel"></div>
</div>

<script>
const products = {
  lipgloss: [
    {src:"lipgloss1.png", desc:"Pink Shine Lipgloss", price:"$10"},
    {src:"lipgloss2.png", desc:"Red Velvet Lipgloss", price:"$12"},
    {src:"lipgloss3.png", desc:"Nude Gloss", price:"$11"},
    {src:"lipgloss5.png", desc:"Sparkle Lipgloss", price:"$13"}
  ],
  perfume: [
    {src:"perfume1.png", desc:"Rose Perfume", price:"$25"},
    {src:"perfume2.png", desc:"Vanilla Perfume", price:"$28"},
    {src:"perfume3.png", desc:"Jasmine Perfume", price:"$30"},
    {src:"perfume4.png", desc:"Musk Perfume", price:"$27"},
    {src:"perfume5.png", desc:"Citrus Perfume", price:"$26"}
  ],
  foundation: [
    {src:"foundation1.png", desc:"Light Beige Foundation", price:"$18"},
    {src:"foundation2.png", desc:"Medium Beige Foundation", price:"$18"},
    {src:"foundation3.png", desc:"Dark Beige Foundation", price:"$18"},
    {src:"foundation4.png", desc:"Golden Foundation", price:"$20"},
    {src:"foundation5.png", desc:"Natural Foundation", price:"$19"}
  ]
};

let autoScrollInterval;

function openViewer(category){
  const container = document.getElementById('carousel');
  container.innerHTML = '';
  products[category].forEach(product => {
    const item = document.createElement('div');
    item.className = 'carousel-item';
    item.innerHTML = `<img src="${product.src}" alt="${product.desc}">
                      <div class="product-info">${product.desc} - ${product.price}</div>`;
    container.appendChild(item);
  });
  document.getElementById('viewer').style.display='flex';

  // Auto-scroll slowly
  let scrollPos = 0;
  clearInterval(autoScrollInterval);
  autoScrollInterval = setInterval(()=>{
    scrollPos += 1;
    if(scrollPos > container.scrollWidth - container.clientWidth){
      scrollPos = 0; // loop back
    }
    container.scrollTo({left:scrollPos, behavior:'smooth'});
  }, 50); // adjust for speed
}

function closeViewer(){
  clearInterval(autoScrollInterval);
  document.getElementById('viewer').style.display='none';
}

// Allow manual scroll
const container = document.getElementById('carousel');
container.addEventListener('wheel', e => { 
  e.preventDefault();
  container.scrollLeft += e.deltaY;
});
container.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
});
container.addEventListener('touchmove', e => {
  let dx = startX - e.touches[0].clientX;
  container.scrollLeft += dx;
  startX = e.touches[0].clientX;
});
</script>
</body>
</html>
