<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty Box Co - Products</title>
<style>
body {
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#fff0f5;
  color:#000;
}

/* HEADER */
h2 {
  text-align:center;
  color:#ff1493;
  margin-top:20px;
  font-size:2rem;
  font-weight:700;
}

/* PRODUCT GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
  gap:20px;
  padding:30px;
}

.product {
  cursor:pointer;
  text-align:center;
  transition: transform 0.3s, box-shadow 0.3s;
  border-radius:15px;
}

.product img {
  width:100%;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(255,20,147,0.4);
  transition: transform 0.3s, box-shadow 0.3s;
}

.product:hover img {
  transform:scale(1.05);
  box-shadow:0 8px 25px rgba(255,20,147,0.6);
}

/* FULLSCREEN MODAL */
#viewer {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
  overflow:hidden;
}

#viewer img {
  max-width:90%;
  max-height:90%;
  transition:transform 0.3s, box-shadow 0.3s;
  border-radius:15px;
}

#viewer img:hover {
  box-shadow:0 0 30px #ff69b4;
}

/* ZOOM */
.zoomed {
  transform:scale(1.8);
}

/* ARROWS */
.arrow {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:48px;
  color:white;
  cursor:pointer;
  user-select:none;
  padding:10px;
}

.arrow-left {
  left:10px;
}

.arrow-right {
  right:10px;
}

/* CLOSE BUTTON */
#closeBtn {
  position:absolute;
  top:20px;
  right:20px;
  font-size:36px;
  color:white;
  cursor:pointer;
  user-select:none;
}

/* CAPTION */
#caption {
  position:absolute;
  bottom:20px;
  color:white;
  font-size:18px;
  text-align:center;
  width:100%;
}
</style>
</head>
<body>

<h2>Beauty Box Co - Products</h2>

<!-- PRODUCT GRID -->
<div class="grid">
  <!-- Lipgloss -->
  <div class="product" onclick="openViewer('lipgloss',0)"><img src="lipgloss1.png" alt="Lipgloss 1"></div>
  <div class="product" onclick="openViewer('lipgloss',1)"><img src="lipgloss2.png" alt="Lipgloss 2"></div>
  <div class="product" onclick="openViewer('lipgloss',2)"><img src="lipgloss3.png" alt="Lipgloss 3"></div>
  <div class="product" onclick="openViewer('lipgloss',3)"><img src="lipgloss5.png" alt="Lipgloss 4"></div>

  <!-- Perfume -->
  <div class="product" onclick="openViewer('perfume',0)"><img src="perfume1.png" alt="Perfume 1"></div>
  <div class="product" onclick="openViewer('perfume',1)"><img src="perfume2.png" alt="Perfume 2"></div>
  <div class="product" onclick="openViewer('perfume',2)"><img src="perfume3.png" alt="Perfume 3"></div>
  <div class="product" onclick="openViewer('perfume',3)"><img src="perfume4.png" alt="Perfume 4"></div>
  <div class="product" onclick="openViewer('perfume',4)"><img src="perfume5.png" alt="Perfume 5"></div>

  <!-- Foundation -->
  <div class="product" onclick="openViewer('foundation',0)"><img src="foundation1.png" alt="Foundation"></div>
</div>

<!-- FULLSCREEN MODAL -->
<div id="viewer">
  <div id="closeBtn" onclick="closeViewer()">&times;</div>
  <div class="arrow arrow-left" onclick="prevImage(event)">&#10094;</div>
  <img id="viewerImg" onclick="toggleZoom(event)">
  <div class="arrow arrow-right" onclick="nextImage(event)">&#10095;</div>
  <div id="caption"></div>
</div>

<script>
const products = {
  lipgloss: ["lipgloss1.png","lipgloss2.png","lipgloss3.png","lipgloss5.png"],
  perfume: ["perfume1.png","perfume2.png","perfume3.png","perfume4.png","perfume5.png"],
  foundation: ["foundation1.png"]
};

let currentProduct = [];
let currentIndex = 0;

function openViewer(product, index){
  currentProduct = products[product];
  currentIndex = index;
  document.getElementById("viewer").style.display = "flex";
  const img = document.getElementById("viewerImg");
  img.src = currentProduct[currentIndex];
  img.classList.remove("zoomed");
  document.getElementById("caption").textContent = product.charAt(0).toUpperCase() + product.slice(1) + " " + (currentIndex+1);
}

function closeViewer(){
  document.getElementById("viewer").style.display = "none";
  document.getElementById("viewerImg").classList.remove("zoomed");
}

document.getElementById("viewerImg").onclick = function(e){ e.stopPropagation(); };
document.getElementById("viewer").onclick = function(){ closeViewer(); };

function toggleZoom(e){
  e.stopPropagation();
  e.target.classList.toggle("zoomed");
}

function prevImage(e){
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + currentProduct.length) % currentProduct.length;
  const img = document.getElementById("viewerImg");
  img.src = currentProduct[currentIndex];
  img.classList.remove("zoomed");
  document.getElementById("caption").textContent = getCaption();
}

function nextImage(e){
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % currentProduct.length;
  const img = document.getElementById("viewerImg");
  img.src = currentProduct[currentIndex];
  img.classList.remove("zoomed");
  document.getElementById("caption").textContent = getCaption();
}

function getCaption(){
  return document.getElementById("caption").textContent = 
    document.getElementById("viewerImg").alt || "" + (currentIndex+1);
}

// Swipe support for mobile
let startX = 0;
const viewerImg = document.getElementById("viewerImg");
viewerImg.addEventListener("touchstart", e => startX = e.touches[0].clientX);
viewerImg.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;
  if (endX - startX > 50) prevImage(event);
  if (startX - endX > 50) nextImage(event);
});
</script>

</body>
</html>
